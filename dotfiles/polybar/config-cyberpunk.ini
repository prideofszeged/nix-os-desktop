# Catppuccin Mocha + Cyberpunk Fusion Colors
[colors]
background = #881e1e2e
background-alt = #CC313244
foreground = #cdd6f4
neon-pink = #f5c2e7
neon-purple = #cba6f7
neon-cyan = #94e2d5
neon-blue = #89b4fa
neon-green = #a6e3a1
neon-peach = #fab387
alert = #f38ba8
disabled = #6c7086

[bar/main]
width = 100%
height = 36pt
radius = 0

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 3pt

border-size = 0
border-color = #00000000

padding-left = 2
padding-right = 2

module-margin = 1

separator = 
separator-foreground = ${colors.neon-purple}

font-0 = JetBrains Mono Nerd Font:size=11;3
font-1 = JetBrains Mono Nerd Font:size=18;5

modules-left = i3 xwindow
modules-center = date
modules-right = filesystem pulseaudio memory cpu wlan eth tray

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

tray-position = right
tray-padding = 4

[module/i3]
type = internal/i3

format = <label-state> <label-mode>
index-sort = true
wrapping-scroll = false

; Focused workspace - NEON GLOW
label-focused = %name%
label-focused-background = ${colors.background-alt}
label-focused-underline= ${colors.neon-pink}
label-focused-padding = 2
label-focused-foreground = ${colors.neon-cyan}

; Unfocused workspace
label-unfocused = %name%
label-unfocused-padding = 2
label-unfocused-foreground = ${colors.disabled}

; Visible workspace
label-visible = %name%
label-visible-background = ${self.label-focused-background}
label-visible-underline = ${colors.neon-purple}
label-visible-padding = ${self.label-focused-padding}

; Urgent workspace
label-urgent = %name%
label-urgent-background = ${colors.alert}
label-urgent-padding = 2
label-urgent-foreground = #ffffff

[module/xwindow]
type = internal/xwindow
label = %title:0:50:...%
label-foreground = ${colors.neon-cyan}

[module/filesystem]
type = internal/fs
interval = 25

mount-0 = /

label-mounted = %{F#cba6f7}󰋊%{F-} %percentage_used%%

label-unmounted = %mountpoint% not mounted
label-unmounted-foreground = ${colors.disabled}

[module/pulseaudio]
type = internal/pulseaudio

format-volume-prefix = "󰕾 "
format-volume-prefix-foreground = ${colors.neon-pink}
format-volume = <label-volume>
format-volume-foreground = ${colors.foreground}

label-volume = %percentage%%

label-muted = 󰖁 muted
label-muted-foreground = ${colors.disabled}

[module/memory]
type = internal/memory
interval = 2
format-prefix = "󰍛 "
format-prefix-foreground = ${colors.neon-cyan}
label = %percentage_used:2%%

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = "󰻠 "
format-prefix-foreground = ${colors.neon-purple}
label = %percentage:2%%

[network-base]
type = internal/network
interval = 5
format-connected = <label-connected>
format-disconnected = <label-disconnected>
label-disconnected = %{F#f38ba8}%ifname%%{F#6c7086} disconnected

[module/wlan]
inherit = network-base
interface-type = wireless
label-connected = %{F#94e2d5}󰖩%{F-} %essid%

[module/eth]
inherit = network-base
interface-type = wired
label-connected = %{F#94e2d5}󰈀%{F-} %local_ip%

[module/date]
type = internal/date
interval = 1

date = 󰥔 %Y-%m-%d  %H:%M:%S

label = %date%
label-foreground = ${colors.neon-peach}

[module/tray]
type = internal/tray
tray-spacing = 8px

[settings]
screenchange-reload = true
pseudo-transparency = true
