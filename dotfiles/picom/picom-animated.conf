# CYBERPUNK PICOM CONFIG with ANIMATIONS
# Using picom-pijulius fork features

# ===== ANIMATIONS =====
animations = true;
animation-stiffness = 200;
animation-window-mass = 0.5;
animation-dampening = 20;
animation-clamping = true;

# Open animation
animation-for-open-window = "zoom";
# animation-for-open-window = "slide-up";  # Alternative

# Close animation  
animation-for-unmap-window = "slide-down";

# Menu animations (faster)
animation-for-transient-window = "slide-down";
animation-for-menu-window = "slide-down";

# Workspace change animation
animation-for-workspace-switch-in = "slide-right";
animation-for-workspace-switch-out = "slide-left";

# ===== SHADOWS (NEON GLOW!) =====
shadow = true;
shadow-radius = 25;
shadow-opacity = 0.85;
shadow-offset-x = -25;
shadow-offset-y = -25;
shadow-color = "#ff0a78";

shadow-exclude = [
    "name = 'Notification'",
    "class_g = 'Conky'",
    "class_g ?= 'Notify-osd'",
    "class_g = 'Cairo-clock'",
    "_GTK_FRAME_EXTENTS@:c"
];

# ===== FADING =====
fading = true;
fade-in-step = 0.04;
fade-out-step = 0.04;
fade-delta = 6;

# ===== TRANSPARENCY / OPACITY =====
inactive-opacity = 0.88;
frame-opacity = 0.90;
inactive-opacity-override = false;
active-opacity = 0.98;

# ===== BACKGROUND BLUR (FROSTED GLASS) =====
blur-background = true;
blur-method = "dual_kawase";
blur-strength = 10;
blur-background-frame = true;
blur-background-fixed = true;

blur-background-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'",
    "_GTK_FRAME_EXTENTS@:c"
];

# ===== CORNERS =====
corner-radius = 14;
rounded-corners-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'"
];

# ===== OPACITY RULES =====
opacity-rule = [
    "98:class_g = 'Alacritty' && focused",
    "88:class_g = 'Alacritty' && !focused",
    "92:class_g = 'Rofi'",
    "88:class_g = 'code-oss'",
    "98:class_g = 'firefox' && focused",
    "88:class_g = 'firefox' && !focused",
    "95:class_g = 'Pcmanfm'"
];

# ===== GENERAL SETTINGS =====
backend = "glx";
vsync = true;
mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
use-damage = true;
log-level = "warn";

# GLX backend specific
glx-no-stencil = true;
glx-no-rebind-pixmap = true;

# ===== WINDOW TYPE SETTINGS =====
wintypes:
{
    tooltip = { fade = true; shadow = true; opacity = 0.92; focus = true; full-shadow = false; };
    dock = { shadow = false; clip-shadow-above = true; }
    dnd = { shadow = false; }
    popup_menu = { opacity = 0.92; blur-background = true; animation = "slide-down"; }
    dropdown_menu = { opacity = 0.92; blur-background = true; animation = "slide-down"; }
};
