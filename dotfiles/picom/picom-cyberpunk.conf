# CYBERPUNK PICOM CONFIG - Maximum Aesthetic!

# Shadows (GLOW effect!)
shadow = true;
shadow-radius = 20;
shadow-opacity = 0.9;
shadow-offset-x = -20;
shadow-offset-y = -20;
shadow-color = "#ff0a78"

# Fading
fading = true;
fade-in-step = 0.05;
fade-out-step = 0.05;
fade-delta = 8;

# Transparency / Opacity
inactive-opacity = 0.85;
frame-opacity = 0.85;
inactive-opacity-override = false;
active-opacity = 0.95;

# Background blurring (HEAVY!)
blur-background = true;
blur-method = "dual_kawase";
blur-strength = 8;
blur-background-frame = true;
blur-background-fixed = true;

blur-background-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'",
    "_GTK_FRAME_EXTENTS@:c"
];

# Corners
corner-radius = 12;
rounded-corners-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'"
];

# Opacity rules for specific windows
opacity-rule = [
    "95:class_g = 'Alacritty' && focused",
    "85:class_g = 'Alacritty' && !focused",
    "90:class_g = 'Rofi'",
    "85:class_g = 'code-oss'",
    "95:class_g = 'firefox' && focused",
    "85:class_g = 'firefox' && !focused"
];

# General Settings
backend = "glx";
vsync = true;
mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
use-damage = true;
log-level = "warn";

# GLX backend specific
glx-no-stencil = true;
glx-no-rebind-pixmap = true;

# Window type settings
wintypes:
{
    tooltip = { fade = true; shadow = true; opacity = 0.9; focus = true; full-shadow = false; };
    dock = { shadow = false; clip-shadow-above = true; }
    dnd = { shadow = false; }
    popup_menu = { opacity = 0.9; blur-background = true; }
    dropdown_menu = { opacity = 0.9; blur-background = true; }
};
