# Starship Prompt - Cyberpunk/Catppuccin Style
# Snazzy, colorful, and informative!

format = """
[░▒▓](#f5c2e7)\
$os\
$username\
[](bg:#cba6f7 fg:#f5c2e7)\
$directory\
[](fg:#cba6f7 bg:#89b4fa)\
$git_branch\
$git_status\
[](fg:#89b4fa bg:#a6e3a1)\
$nodejs\
$rust\
$python\
$golang\
[](fg:#a6e3a1 bg:#fab387)\
$time\
[ ](fg:#fab387)\
$character"""

[os]
disabled = false
style = "bg:#f5c2e7 fg:#1e1e2e"
format = '[ $symbol ]($style)'

[os.symbols]
NixOS = "󱄅"
Linux = "󰌽"
Macos = "󰀵"
Windows = "󰍲"

[username]
show_always = true
style_user = "bg:#f5c2e7 fg:#1e1e2e bold"
style_root = "bg:#f5c2e7 fg:#1e1e2e bold"
format = '[$user ]($style)'
disabled = false

[directory]
style = "bg:#cba6f7 fg:#1e1e2e"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "
"~" = " "

[git_branch]
symbol = ""
style = "bg:#89b4fa fg:#1e1e2e"
format = '[ $symbol $branch ]($style)'

[git_status]
style = "bg:#89b4fa fg:#1e1e2e"
format = '[$all_status$ahead_behind ]($style)'
conflicted = "⚔️ "
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?${count}"
stashed = "📦"
modified = "!${count}"
staged = "+${count}"
renamed = "»"
deleted = "✘"

[nodejs]
symbol = ""
style = "bg:#a6e3a1 fg:#1e1e2e"
format = '[ $symbol ($version) ]($style)'

[rust]
symbol = ""
style = "bg:#a6e3a1 fg:#1e1e2e"
format = '[ $symbol ($version) ]($style)'

[python]
symbol = ""
style = "bg:#a6e3a1 fg:#1e1e2e"
format = '[ $symbol ($version) ]($style)'

[golang]
symbol = ""
style = "bg:#a6e3a1 fg:#1e1e2e"
format = '[ $symbol ($version) ]($style)'

[time]
disabled = false
time_format = "%R"
style = "bg:#fab387 fg:#1e1e2e"
format = '[  $time ]($style)'

[character]
success_symbol = "[❯](bold #a6e3a1)"
error_symbol = "[❯](bold #f38ba8)"
vimcmd_symbol = "[❮](bold #89b4fa)"

[cmd_duration]
min_time = 500
format = "took [$duration](bold #f9e2af) "
